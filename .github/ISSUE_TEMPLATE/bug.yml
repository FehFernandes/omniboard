name: Bug
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this is a **security** issue, do not use this form — see
        [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: And what you expected to happen instead.
      placeholder: |
        Closing the note modal with Esc discards the text I typed.
        I expected it to be saved.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Step by step. This is the part that speeds up the fix the most.
      placeholder: |
        1. Open the app without logging in
        2. Pick the "Nota" tool, click on the canvas
        3. Type any text
        4. Press Esc
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: Where it happens
      description: Browser and OS; for API issues, the Go version.
      placeholder: Chrome 130, Linux
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Engine (packages/core)
        - React wrapper (packages/react)
        - Web app (apps/web)
        - API (apps/api)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Console errors, screenshots or video
      description: |
        Paste the browser console error (F12) or the API log, if any.
        A screenshot helps a lot for visual problems.
