name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push cancels the previous run of the same ref: it saves queue time without
# losing the result of the latest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lib (packages/core e packages/react) ──
  lib:
    name: Lib (core + react)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter "./packages/*" typecheck
      - name: Tests
        run: pnpm test:lib
      - name: Build
        run: pnpm build:lib
      # The dist feeds the app and the e2e job: publish it so they do not have to
      # rebuild the library.
      - uses: actions/upload-artifact@v4
        with:
          name: lib-dist
          path: |
            packages/core/dist
            packages/react/dist
          retention-days: 1

  # ── App web (SPA) ──
  web:
    name: Web (SPA)
    runs-on: ubuntu-latest
    needs: lib
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: lib-dist
          path: packages
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm --filter omniboard-web typecheck
      - name: Tests
        run: pnpm test:web
      - name: Build
        run: pnpm build:web

  # ── API (Go) ──
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omniboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: omniboard_test
      DB_SSLMODE: disable
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: apps/api/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Run gofmt -w on these files:"; echo "$files"; exit 1
          fi

  # ── End-to-end in a real browser ──
  # Separate because it downloads a browser and is the slowest job; it runs after
  # the rest passes, so no minutes are spent when something basic is already broken.
  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    needs: [lib, web]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: lib-dist
          path: packages
      - name: Install Playwright's Chromium
        run: pnpm --filter omniboard-web exec playwright install --with-deps chromium
      - name: E2E tests
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7

  # ── Security: known vulnerabilities in the Go dependencies ──
  # Informational: a standard-library advisory may depend on the toolchain patch
  # and must not block a merge — but it stays visible in the log.
  govulncheck:
    name: govulncheck (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
