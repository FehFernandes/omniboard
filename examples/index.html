<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OmniBoard — demo</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; }
      #app { position: fixed; inset: 0; }
      #board { position: absolute; inset: 0; }

      body {
        --ui-solid: #ffffff;
        --ui-fg: #1e1e1e;
        --ui-border: #e8e8ec;
        --ui-hover: #f2f1fb;
        --ui-accent: #6965db;
        --ui-muted: #8a8a90;
        --ui-danger: #e03131;
        --pill-shadow: 0 1px 3px #0000000f, 0 1px 2px #00000014;
        --pop-shadow: 0 4px 16px #0000001a;
      }
      body[data-theme="dark"] {
        --ui-solid: #232326;
        --ui-fg: #e3e3e3;
        --ui-border: #3a3a3c;
        --ui-hover: #2f2e3b;
        --ui-accent: #a8a5ff;
        --ui-muted: #9a9aa0;
        --ui-danger: #ff6b6b;
        --pill-shadow: 0 1px 3px #00000040;
        --pop-shadow: 0 6px 20px #00000055;
      }

      /* ---------- Floating "island" pills ---------- */
      .pill {
        position: absolute; top: 14px; z-index: 20;
        display: flex; align-items: center; gap: 3px; padding: 5px;
        background: var(--ui-solid); color: var(--ui-fg);
        border: 1px solid var(--ui-border); border-radius: 14px;
        box-shadow: var(--pill-shadow);
      }
      .pill-left { left: 14px; }
      .pill-tools { left: 50%; transform: translateX(-50%); }
      .pill-right { right: 14px; }
      .sep { width: 1px; height: 22px; background: var(--ui-border); margin: 0 4px; }

      .pill button {
        border: none; background: transparent; color: var(--ui-fg); cursor: pointer;
        border-radius: 9px; display: inline-flex; align-items: center; justify-content: center;
      }
      .pill button svg { display: block; }
      .tool { width: 38px; height: 38px; }
      .tool:hover { background: var(--ui-hover); }
      .tool.active { background: var(--ui-accent); color: #fff; }

      /* Shapes palette */
      .shapes-dd { position: relative; display: inline-flex; align-items: center; height: 38px; }
      .shapes-dd > summary { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; list-style: none; border-radius: 9px; cursor: pointer; }
      .shapes-dd > summary::-webkit-details-marker { display: none; }
      .shapes-dd > summary:hover { background: var(--ui-hover); }
      .shapes-dd > summary.active { background: var(--ui-accent); color: #fff; }
      .shapes-dd > summary svg { display: block; }
      .shapes-panel {
        position: absolute; top: calc(100% + 10px); left: 50%; transform: translateX(-50%);
        display: grid; grid-template-columns: repeat(3, 44px); gap: 4px;
        padding: 8px; min-width: unset; width: auto;
        background: var(--ui-solid); border: 1px solid var(--ui-border);
        border-radius: 14px; box-shadow: var(--pop-shadow);
      }
      .shapes-panel button {
        width: 44px; height: 44px; border: 1px solid transparent; border-radius: 9px;
        background: transparent; color: var(--ui-fg); cursor: pointer;
        display: inline-flex; align-items: center; justify-content: center;
      }
      .shapes-panel button:hover { background: var(--ui-hover); }
      .shapes-panel button svg { display: block; width: 22px; height: 22px; }
      /* When locked, dim the drawing tools (but keep the lock button usable). */
      .pill-tools.locked .tool,
      .pill-tools.locked .shapes-dd { opacity: .4; pointer-events: none; }
      .iconbtn {
        width: 36px; height: 36px;
        display: inline-flex; align-items: center; justify-content: center;
      }
      .iconbtn:hover { background: var(--ui-hover); }
      .iconbtn.active { background: var(--ui-accent); color: #fff; }

      input[type="color"] {
        width: 32px; height: 32px; padding: 0; border: 1px solid var(--ui-border);
        border-radius: 8px; background: var(--ui-solid); cursor: pointer;
      }

      /* ---------- Dropdowns (details) ---------- */
      details.dd { position: relative; display: inline-flex; align-items: center; }
      details.dd > summary { list-style: none; display: inline-flex; }
      details.dd > summary::-webkit-details-marker { display: none; }
      .panel {
        position: absolute; top: calc(100% + 9px); left: 0; width: 246px;
        background: var(--ui-solid); border: 1px solid var(--ui-border);
        border-radius: 14px; box-shadow: var(--pop-shadow); padding: 7px;
        display: flex; flex-direction: column; gap: 2px;
      }
      .panel.right { left: auto; right: 0; }

      /* Board selector dropdown hugs its content (like the summary). */
      #bmenu .panel { width: auto; min-width: 200px; max-width: 300px; }

      /* ---------- Board selector ---------- */
      .board-current {
        display: flex; align-items: center; gap: 8px; height: 38px;
        padding: 0 10px 0 12px; border-radius: 10px; cursor: pointer;
        max-width: 260px;
      }
      .board-current:hover, #bmenu[open] .board-current { background: var(--ui-hover); }
      .board-current .glyph { display: inline-flex; color: var(--ui-muted); flex: 0 0 auto; }
      .board-current .glyph svg { width: 17px; height: 17px; }
      .board-current .cur-name {
        font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis;
        white-space: nowrap; max-width: 190px;
      }
      .board-current .chev { display: inline-flex; color: var(--ui-muted); flex: 0 0 auto; transition: transform .15s; }
      #bmenu[open] .board-current .chev { transform: rotate(180deg); }

      .board-row {
        display: flex; align-items: center; gap: 6px; padding: 8px 8px; margin: 1px 0;
        border-radius: 9px; cursor: pointer; font-size: 13px;
      }
      .board-row:hover { background: var(--ui-hover); }
      .board-row.active { background: color-mix(in srgb, var(--ui-accent) 12%, transparent); }
      .board-row.active .brow-name { color: var(--ui-accent); font-weight: 600; }
      .brow-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .brow-input {
        flex: 1; font: inherit; border: 1px solid var(--ui-accent); border-radius: 6px;
        padding: 3px 6px; background: var(--ui-solid); color: var(--ui-fg); outline: none;
      }
      .brow-act {
        width: 26px; height: 26px; border: none; background: transparent; border-radius: 7px;
        cursor: pointer; color: var(--ui-fg); display: inline-flex; align-items: center;
        justify-content: center; opacity: 0; flex: 0 0 auto;
      }
      .board-row:hover .brow-act { opacity: .55; }
      .brow-act:hover { background: var(--ui-border); opacity: 1 !important; }
      .brow-act svg { width: 14px; height: 14px; }
      .board-add { margin-top: 5px; border-top: 1px solid var(--ui-border); padding-top: 6px; }
      .board-add button {
        width: 100%; display: flex; align-items: center; gap: 9px; padding: 9px 8px;
        border: none; background: transparent; border-radius: 9px; cursor: pointer;
        color: var(--ui-accent); font-weight: 600; font-size: 13px;
      }
      .board-add button:hover { background: var(--ui-hover); }
      .board-add .ico, .panel .ico { display: inline-flex; width: 16px; height: 16px; }
      .board-add .ico svg, .panel .ico svg { width: 16px; height: 16px; }

      /* ---------- Hamburger / more menu ---------- */
      .panel .item {
        display: flex; align-items: center; gap: 11px; width: 100%;
        padding: 9px 10px; border: none; border-radius: 9px; background: transparent;
        color: var(--ui-fg); cursor: pointer; font-size: 13px; text-align: left;
      }
      .panel .item:hover { background: var(--ui-hover); }
      .panel .item .ico { opacity: .72; }
      .panel .item.danger { color: var(--ui-danger); }
      .panel .item.danger .ico { opacity: .85; }
      .panel hr { border: none; border-top: 1px solid var(--ui-border); margin: 6px 2px; width: 100%; }
      .panel .sec {
        font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em;
        color: var(--ui-muted); font-weight: 700; padding: 9px 10px 3px;
      }
      .panel .sec:first-child { padding-top: 4px; }
      .panel label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ui-fg); padding: 6px 10px; }
      .panel label.row { flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; }
      .panel label input[type="range"] { width: 100%; }

      /* ---------- Properties sidebar (contextual) ---------- */
      .props {
        position: absolute; left: 14px; top: 72px; z-index: 19;
        width: 208px; max-height: calc(100vh - 92px); overflow: auto;
        display: none; flex-direction: column; padding: 12px;
        background: var(--ui-solid); color: var(--ui-fg);
        border: 1px solid var(--ui-border); border-radius: 14px;
        box-shadow: var(--pill-shadow);
      }
      .props .sec {
        font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em;
        color: var(--ui-muted); font-weight: 700; margin: 10px 2px 6px;
      }
      .props section:first-child .sec { margin-top: 0; }
      .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
      .swatch {
        width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--ui-border);
        cursor: pointer; padding: 0; position: relative;
      }
      .swatch.active { box-shadow: 0 0 0 2px var(--ui-solid), 0 0 0 4px var(--ui-accent); }
      .swatch.none {
        background:
          linear-gradient(to top right, transparent 44%, var(--ui-danger) 45%, var(--ui-danger) 55%, transparent 56%),
          var(--ui-solid);
      }
      .swatch.custom { overflow: hidden; }
      .swatch.custom input {
        width: 200%; height: 200%; margin: -25%; border: none; padding: 0;
        background: none; cursor: pointer;
      }
      .seg { display: flex; gap: 4px; }
      .seg button {
        flex: 1; height: 32px; border: 1px solid var(--ui-border); border-radius: 8px;
        background: var(--ui-solid); color: var(--ui-fg); cursor: pointer;
        display: inline-flex; align-items: center; justify-content: center;
      }
      .seg button:hover { background: var(--ui-hover); }
      .seg button.active {
        border-color: var(--ui-accent); color: var(--ui-accent);
        background: color-mix(in srgb, var(--ui-accent) 14%, transparent);
      }
      .seg button.danger { color: var(--ui-danger); }
      .seg button svg { display: block; width: 16px; height: 16px; }
      .props input[type="range"] { width: 100%; margin: 2px 0; }
      .props select,
      .props input[type="number"] {
        width: 100%; height: 32px; border: 1px solid var(--ui-border); border-radius: 8px;
        background: var(--ui-solid); color: var(--ui-fg); padding: 0 8px; outline: none;
      }
      .props label {
        display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--ui-fg);
      }
      .text-row { display: grid; grid-template-columns: 1fr 64px; gap: 8px; }
      .dash { display: inline-block; border-radius: 2px; background: currentColor; }

      .toast {
        position: absolute; bottom: 16px; right: 16px; z-index: 25;
        background: var(--ui-solid); color: var(--ui-fg); border: 1px solid var(--ui-border);
        padding: 8px 14px; border-radius: 999px; font-size: 12px; opacity: 0;
        transition: opacity .25s; box-shadow: var(--pill-shadow); pointer-events: none;
      }
      .toast.show { opacity: 1; }
      .hint {
        position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
        z-index: 20; font-size: 12px; color: var(--ui-fg); opacity: .66;
        background: var(--ui-solid); border: 1px solid var(--ui-border);
        padding: 7px 14px; border-radius: 999px; box-shadow: var(--pill-shadow);
        max-width: 92vw; text-align: center;
      }
    </style>
  </head>
  <body data-theme="light">
    <div id="app">
      <div id="board"></div>

      <!-- Contextual properties sidebar (Excalidraw-like) -->
      <aside class="props" id="props">
        <section>
          <div class="sec">Stroke</div>
          <div class="swatches" id="strokeSwatches"></div>
        </section>
        <section id="textSection" style="display:none;">
          <div class="sec">Text</div>
          <div class="text-row">
            <label>Font
              <select id="fontFamily"></select>
            </label>
            <label>Size
              <input type="number" id="fontSize" min="8" max="120" step="1" />
            </label>
          </div>
          <div class="seg" id="fontStyleSeg" style="margin-top:8px;">
            <button id="fontBold" title="Bold">B</button>
            <button id="fontItalic" title="Italic"><i>I</i></button>
          </div>
          <div class="seg" id="textAlignSeg" style="margin-top:8px;">
            <button data-align="left" title="Align left"></button>
            <button data-align="center" title="Align center"></button>
            <button data-align="right" title="Align right"></button>
          </div>
          <div class="seg" id="verticalAlignSeg" style="margin-top:8px;">
            <button data-valign="top" title="Align top"></button>
            <button data-valign="middle" title="Align middle"></button>
          </div>
        </section>
        <section>
          <div class="sec">Background</div>
          <div class="swatches" id="bgSwatches"></div>
        </section>
        <section>
          <div class="sec">Stroke width</div>
          <div class="seg" id="widthSeg">
            <button data-w="1" title="Thin"><span class="dash" style="width:16px;height:2px"></span></button>
            <button data-w="2" title="Medium"><span class="dash" style="width:16px;height:3px"></span></button>
            <button data-w="4" title="Thick"><span class="dash" style="width:16px;height:5px"></span></button>
          </div>
        </section>
        <section>
          <div class="sec">Opacity</div>
          <input type="range" id="opacity" min="0" max="100" step="5" value="100" />
        </section>
        <section>
          <div class="sec">Layers</div>
          <div class="seg">
            <button id="pBack" title="Send to back"></button>
            <button id="pFront" title="Bring to front"></button>
          </div>
        </section>
        <section>
          <div class="sec">Actions</div>
          <div class="seg">
            <button id="pDup" title="Duplicate"></button>
            <button id="pDel" class="danger" title="Delete"></button>
          </div>
        </section>
        <section id="stickyColorSection" style="display:none;">
          <div class="sec">Sticky color</div>
          <div class="swatches" id="stickySwatches"></div>
        </section>
      </aside>

      <!-- Left island: hamburger + board selector -->
      <div class="pill pill-left">
        <details class="dd" id="hamb">
          <summary class="iconbtn" id="hambBtn" title="Menu"></summary>
          <div class="panel">
            <div class="sec">Appearance</div>
            <label class="row">Selection color<input type="color" id="selColor" value="#6965db" /></label>
            <label>Grid spacing<input type="range" id="gridSpace" min="10" max="80" value="20" /></label>
            <label>Handle size<input type="range" id="handleSz" min="4" max="18" value="8" /></label>
            <label>Background pattern
              <select id="gridPattern">
                <option value="dots">Dots</option>
                <option value="lines">Lines</option>
                <option value="grid">Grid</option>
                <option value="none">None</option>
              </select>
            </label>

            <div class="sec">Lab ✨</div>
            <label class="row">Search
              <input type="search" id="searchBox" placeholder="text..." style="flex:1; min-width:0; height:30px; border:1px solid var(--ui-border); border-radius:8px; background:var(--ui-solid); color:var(--ui-fg); padding:0 8px; outline:none;" />
            </label>
            <button class="item" data-act="focus"><span class="ico"></span>Focus mode (dim)</button>
            <button class="item" data-act="celebrate"><span class="ico"></span>Celebrate 🎉</button>
            <div class="sec">Auto-arrange</div>
            <div class="seg">
              <button data-layout="grid" title="Grid">▦</button>
              <button data-layout="horizontal" title="Horizontal">▭</button>
              <button data-layout="vertical" title="Vertical">▯</button>
              <button data-layout="circle" title="Circle">◯</button>
            </div>

            <div class="sec">Actions</div>
            <button class="item" data-act="fit"><span class="ico"></span>Fit to screen</button>
            <button class="item" data-act="png"><span class="ico"></span>Export PNG</button>
            <button class="item" data-act="export"><span class="ico"></span>Export workspace (JSON)</button>
            <button class="item" data-act="import"><span class="ico"></span>Import workspace (JSON)</button>

            <hr />
            <button class="item danger" data-act="clear"><span class="ico"></span>Clear this board</button>
          </div>
        </details>
        <span class="sep"></span>
        <details class="dd" id="bmenu">
          <summary class="board-current" title="Switch board">
            <span class="glyph" id="boardGlyph"></span>
            <span class="cur-name" id="activeName">Board 1</span>
            <span class="chev" id="chevIcon"></span>
          </summary>
          <div class="panel">
            <div id="boardList"></div>
            <div class="board-add">
              <button id="addBoard"><span class="ico" id="addIcon"></span>New board</button>
            </div>
          </div>
        </details>
      </div>

      <!-- Center island: tools -->
      <div class="pill pill-tools" id="toolbar">
        <button class="iconbtn" id="lock" title="Navigation mode (interact without editing)"></button>
        <span class="sep"></span>
        <button class="tool" data-tool="selection" title="Select (V)"></button>
        <button class="tool" data-tool="hand" title="Pan (H)"></button>
        <span class="sep"></span>
        <button class="tool" data-tool="rectangle" title="Rectangle (R)"></button>
        <button class="tool" data-tool="ellipse" title="Ellipse (O)"></button>
        <button class="tool" data-tool="line" title="Line (L)"></button>
        <button class="tool" data-tool="arrow" title="Arrow (A)"></button>
        <details class="shapes-dd" id="shapesDD">
          <summary id="shapesBtn" title="Shapes (diagrams / system design)"></summary>
          <div class="shapes-panel" id="shapesPanel"></div>
        </details>
        <button class="tool" data-tool="freedraw" title="Freehand (P)"></button>
        <button class="tool" data-tool="text" title="Text (T)"></button>
        <span class="sep"></span>
        <button class="tool" data-tool="image" title="Image"></button>
        <button class="tool" data-tool="embed" title="Embed (iframe / video)"></button>
        <button class="tool" data-tool="tasks" title="Tasks (card)"></button>
        <details class="shapes-dd" id="stickyDD">
          <summary id="stickyBtn" title="Post-it / Sticky note"></summary>
          <div class="shapes-panel" id="stickyPanel" style="grid-template-columns: repeat(3, 44px);"></div>
        </details>
        <button class="tool" data-tool="frame" title="Frame (whiteboard)"></button>
      </div>

      <!-- Right island: quick actions -->
      <div class="pill pill-right">
        <button class="iconbtn" id="undo" title="Undo (Ctrl+Z)"></button>
        <button class="iconbtn" id="redo" title="Redo (Ctrl+Shift+Z)"></button>
        <span class="sep"></span>
        <button class="iconbtn" id="zoomOut" title="Zoom out"></button>
        <button class="iconbtn" id="zoomIn" title="Zoom in"></button>
        <span class="sep"></span>
        <button class="iconbtn" id="fullscreen" title="Fullscreen"></button>
        <button class="iconbtn" id="theme" title="Toggle theme"></button>
      </div>

      <div class="toast" id="toast">💾 saved</div>
    </div>

    <!--
      This demo imports the compiled build from ../dist.
      Run `npm run build` before opening the file.
    -->
    <script type="module">
      import {
        Board, BoardManager,
        attachWorkspacePersistence, workspaceLocalStorageAdapter,
        ICONS, STICKY_COLORS,
      } from "../packages/core/dist/index.js";

      const board = new Board(document.getElementById("board"), {
        grid: true, theme: "light", selectionToolbar: false,
      });
      const manager = new BoardManager(board, { defaultName: "Board 1" });
      const icon = (name) => ICONS[name] || "";
      const svg = (inner) =>
        `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
      const HAMB = svg('<line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>');
      const LAYERS = svg('<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>');
      const CHEVRON = svg('<polyline points="6 9 12 15 18 9"/>');
      const NEW_BOARD = svg('<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>');
      const CHECKLIST = svg('<polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>');
      const STICKY_ICON = svg('<rect x="3" y="3" width="18" height="18" rx="3"/><line x1="7" y1="9" x2="17" y2="9"/><line x1="7" y1="13" x2="14" y2="13"/>');
      const FRAME_ICON = svg('<rect x="3" y="5" width="18" height="14" rx="1" stroke-dasharray="3 2"/><line x1="3" y1="3" x2="9" y2="3"/>');
      const MINIMIZE = svg('<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3m8 0v-3a2 2 0 0 1 2-2h3"/>');
      const ALIGN_LEFT = svg('<line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="15" y2="12"/><line x1="4" y1="18" x2="18" y2="18"/>');
      const ALIGN_CENTER = svg('<line x1="4" y1="6" x2="20" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="5" y1="18" x2="19" y2="18"/>');
      const ALIGN_RIGHT = svg('<line x1="4" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="6" y1="18" x2="20" y2="18"/>');
      const VALIGN_TOP = svg('<line x1="5" y1="5" x2="19" y2="5"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="15" x2="14" y2="15"/>');
      const VALIGN_MIDDLE = svg('<line x1="5" y1="12" x2="19" y2="12"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="17" x2="16" y2="17"/>');
      // Shapes palette (diagrams / system design)
      const SHAPE_SVGS = {
        diamond: svg('<path d="M12 3 21 12 12 21 3 12z"/>'),
        triangle: svg('<path d="M12 4 21 20 3 20z"/>'),
        hexagon: svg('<path d="M7.5 4 16.5 4 21 12 16.5 20 7.5 20 3 12z"/>'),
        parallelogram: svg('<path d="M8 5 21 5 16 19 3 19z"/>'),
        cylinder: svg('<path d="M4 6c0-1.6 3.6-3 8-3s8 1.4 8 3v12c0 1.6-3.6 3-8 3s-8-1.4-8-3z"/><path d="M4 6c0 1.6 3.6 3 8 3s8-1.4 8-3"/>'),
        cloud: svg('<path d="M7 18h10a4 4 0 0 0 .5-8 5 5 0 0 0-9.6-1.3A3.5 3.5 0 0 0 7 18z"/>'),
        document: svg('<path d="M5 4 19 4 19 16 C 16 20 15 14 12 16.5 C 9 19 8 14 5 16.5 Z"/>'),
        star: svg('<path d="M12 3 14.6 9.2 21 9.6 16 13.8 17.6 20 12 16.4 6.4 20 8 13.8 3 9.6 9.4 9.2z"/>'),
        pill: svg('<rect x="3" y="7" width="18" height="10" rx="5"/>'),
      };
      const SHAPES = [
        ["diamond", "Diamond / decision"],
        ["pill", "Start / end"],
        ["parallelogram", "Input / output"],
        ["hexagon", "Preparation"],
        ["cylinder", "Database"],
        ["cloud", "Cloud / service"],
        ["document", "Document"],
        ["triangle", "Triangle"],
        ["star", "Star"],
      ];
      const ZOOM_IN = svg('<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>');
      const ZOOM_OUT = svg('<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/>');

      // ---------- Icons ----------
      const toolIcon = {
        selection: "cursor", hand: "hand", rectangle: "rectangle", ellipse: "ellipse",
        line: "diagonal", freedraw: "pencil", text: "text",
        image: "image", embed: "globe",
      };
      document.querySelectorAll("#toolbar button[data-tool]").forEach((b) => {
        b.innerHTML = icon(toolIcon[b.dataset.tool]);
      });
      document.querySelector('#toolbar [data-tool="tasks"]').innerHTML = CHECKLIST;
      document.querySelector('#toolbar [data-tool="frame"]').innerHTML = FRAME_ICON;

      // ---------- Sticky color picker (in toolbar) ----------
      const stickyDD = document.getElementById("stickyDD");
      const stickyBtn = document.getElementById("stickyBtn");
      const stickyPanel = document.getElementById("stickyPanel");
      const STICKY_PALETTE = ["#FFF9B1", "#D1F7C4", "#AECBFA", "#F9CBFF", "#FFDDC1", "#E8D5FF"];
      let stickyColor = STICKY_PALETTE[0];
      stickyBtn.innerHTML = STICKY_ICON;
      for (const c of STICKY_PALETTE) {
        const b = document.createElement("button");
        b.title = "Post-it " + c;
        b.style.background = c;
        b.style.border = "2px solid " + (c === stickyColor ? "var(--ui-accent)" : "transparent");
        b.style.borderRadius = "10px";
        b.onclick = () => {
          stickyColor = c;
          board.setStickyColor(c);
          board.setTool("sticky");
          stickyDD.open = false;
          // Update borders.
          [...stickyPanel.children].forEach((x) => {
            x.style.border = "2px solid " + (x.style.background === b.style.background ? "var(--ui-accent)" : "transparent");
          });
        };
        stickyPanel.appendChild(b);
      }

      // ---------- Shapes palette ----------
      const shapesDD = document.getElementById("shapesDD");
      const shapesBtn = document.getElementById("shapesBtn");
      const shapesPanel = document.getElementById("shapesPanel");
      shapesBtn.innerHTML = SHAPE_SVGS[board.getShapeKind()] || SHAPE_SVGS.diamond;
      for (const [kind, label] of SHAPES) {
        const b = document.createElement("button");
        b.title = label;
        b.innerHTML = SHAPE_SVGS[kind];
        b.onclick = () => {
          board.setShapeKind(kind);
          shapesBtn.innerHTML = SHAPE_SVGS[kind];
          shapesDD.open = false;
        };
        shapesPanel.appendChild(b);
      }
      document.getElementById("undo").innerHTML = icon("undo");
      document.getElementById("redo").innerHTML = icon("redo");
      document.getElementById("zoomOut").innerHTML = ZOOM_OUT;
      document.getElementById("zoomIn").innerHTML = ZOOM_IN;
      document.getElementById("hambBtn").innerHTML = HAMB;
      document.getElementById("boardGlyph").innerHTML = LAYERS;
      document.getElementById("chevIcon").innerHTML = CHEVRON;
      document.getElementById("addIcon").innerHTML = NEW_BOARD;
      const menuIcons = { fit: "maximize", png: "image", export: "download", import: "upload", clear: "trash" };
      document.querySelectorAll("#hamb .item[data-act]").forEach((b) => {
        b.querySelector(".ico").innerHTML = icon(menuIcons[b.dataset.act]);
      });

      // ---------- Arrow dropdown (straight / curve) ----------
      // ---------- Board selector ----------
      const bmenu = document.getElementById("bmenu");
      const hamb = document.getElementById("hamb");
      const activeName = document.getElementById("activeName");
      const boardList = document.getElementById("boardList");

      function renderBoards(documents, activeId) {
        activeName.textContent = documents.find((d) => d.id === activeId)?.name ?? "";
        boardList.innerHTML = "";
        for (const d of documents) {
          const row = document.createElement("div");
          row.className = "board-row" + (d.id === activeId ? " active" : "");

          const name = document.createElement("span");
          name.className = "brow-name";
          name.textContent = d.name;
          name.onclick = () => { manager.switch(d.id); bmenu.open = false; };
          name.ondblclick = (e) => { e.stopPropagation(); startRename(row, name, d); };
          row.appendChild(name);

          const edit = document.createElement("button");
          edit.className = "brow-act";
          edit.title = "Rename";
          edit.innerHTML = icon("edit");
          edit.onclick = (e) => { e.stopPropagation(); startRename(row, name, d); };
          row.appendChild(edit);

          if (documents.length > 1) {
            const del = document.createElement("button");
            del.className = "brow-act";
            del.title = "Delete board";
            del.innerHTML = icon("trash");
            del.onclick = (e) => { e.stopPropagation(); manager.remove(d.id); };
            row.appendChild(del);
          }
          boardList.appendChild(row);
        }
      }

      function startRename(row, nameEl, d) {
        const input = document.createElement("input");
        input.className = "brow-input";
        input.value = d.name;
        row.replaceChild(input, nameEl);
        input.focus();
        input.select();
        let done = false;
        const commit = () => {
          if (done) return; done = true;
          const v = input.value.trim();
          if (v && v !== d.name) manager.rename(d.id, v);
          else renderBoards(manager.list(), manager.getActiveId());
        };
        input.onblur = commit;
        input.onkeydown = (ev) => {
          if (ev.key === "Enter") { ev.preventDefault(); commit(); }
          else if (ev.key === "Escape") { done = true; renderBoards(manager.list(), manager.getActiveId()); }
          ev.stopPropagation();
        };
      }

      manager.on("documentsChange", (e) => renderBoards(e.documents, e.activeId));
      manager.on("activeChange", (e) => renderBoards(manager.list(), e.activeId));
      renderBoards(manager.list(), manager.getActiveId());
      document.getElementById("addBoard").onclick = () => { manager.create(); bmenu.open = false; };

      // ---------- Autosave (workspace) ----------
      const toast = document.getElementById("toast");
      let toastTimer;
      const flash = (msg) => {
        toast.textContent = msg; toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 1100);
      };
      attachWorkspacePersistence(manager, workspaceLocalStorageAdapter("openboard-demo-ws"), {
        debounceMs: 400, loadOnStart: true, onSave: () => flash("💾 saved"),
      });

      // ---------- Tools ----------
      const toolbar = document.getElementById("toolbar");
      const refreshTool = (tool) => {
        toolbar.querySelectorAll("button[data-tool]").forEach((b) =>
          b.classList.toggle("active", b.dataset.tool === tool));
        shapesBtn.classList.toggle("active", tool === "shape");
        stickyBtn.classList.toggle("active", tool === "sticky");
      };
      toolbar.addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (btn?.dataset.tool) board.setTool(btn.dataset.tool);
      });
      board.on("toolChange", (e) => refreshTool(e.tool));
      refreshTool(board.getTool());

      // ---------- Theme ----------
      const themeBtn = document.getElementById("theme");
      themeBtn.innerHTML = icon("moon");
      board.on("themeChange", (e) => {
        document.body.dataset.theme = e.theme;
        themeBtn.innerHTML = e.theme === "dark" ? icon("sun") : icon("moon");
      });
      themeBtn.onclick = () => board.toggleTheme();

      // ---------- Properties sidebar (contextual, Excalidraw-like) ----------
      const props = document.getElementById("props");
      const strokeSwatches = document.getElementById("strokeSwatches");
      const bgSwatches = document.getElementById("bgSwatches");
      const widthSeg = document.getElementById("widthSeg");
      const opacityInput = document.getElementById("opacity");
      const textSection = document.getElementById("textSection");
      const fontFamilyInput = document.getElementById("fontFamily");
      const fontSizeInput = document.getElementById("fontSize");
      const fontBold = document.getElementById("fontBold");
      const fontItalic = document.getElementById("fontItalic");
      const textAlignSeg = document.getElementById("textAlignSeg");
      const verticalAlignSeg = document.getElementById("verticalAlignSeg");
      const STROKES = ["#1e1e1e", "#e03131", "#2f9e44", "#1971c2", "#f08c00"];
      const BGS = ["transparent", "#ffec99", "#ffc9c9", "#b2f2bb", "#a5d8ff"];
      const FONT_OPTIONS = [
        ["system-ui, -apple-system, sans-serif", "Sistema"],
        ["Arial, Helvetica, sans-serif", "Arial"],
        ["Georgia, serif", "Georgia"],
        ["'Times New Roman', Times, serif", "Times"],
        ["'Courier New', Courier, monospace", "Courier"],
        ["Verdana, Geneva, sans-serif", "Verdana"],
      ];
      const norm = (c) => (c || "").toLowerCase();

      fontFamilyInput.innerHTML = FONT_OPTIONS
        .map(([value, label]) => `<option value="${value}">${label}</option>`)
        .join("");
      textAlignSeg.querySelector('[data-align="left"]').innerHTML = ALIGN_LEFT;
      textAlignSeg.querySelector('[data-align="center"]').innerHTML = ALIGN_CENTER;
      textAlignSeg.querySelector('[data-align="right"]').innerHTML = ALIGN_RIGHT;
      verticalAlignSeg.querySelector('[data-valign="top"]').innerHTML = VALIGN_TOP;
      verticalAlignSeg.querySelector('[data-valign="middle"]').innerHTML = VALIGN_MIDDLE;

      document.getElementById("pFront").innerHTML = icon("bringForward");
      document.getElementById("pBack").innerHTML = icon("sendBackward");
      document.getElementById("pDup").innerHTML = icon("copy");
      document.getElementById("pDel").innerHTML = icon("trash");
      document.getElementById("pFront").onclick = () => board.bringToFront();
      document.getElementById("pBack").onclick = () => board.sendToBack();
      document.getElementById("pDup").onclick = () => board.duplicateSelected();
      document.getElementById("pDel").onclick = () => board.deleteSelected();

      // Style of the first selected element, or the current default style.
      const currentStyle = () => {
        const ids = board.getSelectedIds();
        if (ids.length) {
          const el = board.getElements().find((e) => e.id === ids[0]);
          if (el) return el;
        }
        return board.getStyle();
      };

      const currentTextStyle = () => {
        const ids = board.getSelectedIds();
        for (const id of ids) {
          const el = board.getElements().find((e) => e.id === id);
          if (el?.type === "text") {
            return {
              ...board.getTextStyle(),
              fontSize: el.fontSize,
              fontFamily: el.fontFamily,
              fontWeight: el.fontWeight || "normal",
              fontStyle: el.fontStyle || "normal",
              textAlign: el.textAlign || "left",
              verticalAlign: el.verticalAlign || "top",
            };
          }
          if (el && el.type !== "text") {
            return {
              ...board.getLabelStyle(),
              fontSize: el.labelFontSize || board.getLabelStyle().fontSize,
              fontFamily: el.labelFontFamily || board.getLabelStyle().fontFamily,
              fontWeight: el.labelFontWeight || board.getLabelStyle().fontWeight,
              fontStyle: el.labelFontStyle || board.getLabelStyle().fontStyle,
              textAlign: el.labelTextAlign || board.getLabelStyle().textAlign,
              verticalAlign: el.labelVerticalAlign || board.getLabelStyle().verticalAlign,
            };
          }
        }
        return board.getTextStyle();
      };

      const hasTextSelection = () => {
        const ids = new Set(board.getSelectedIds());
        return board.getElements().some((e) => ids.has(e.id) && e.type === "text");
      };

      const hasLabelSelection = () => {
        const ids = new Set(board.getSelectedIds());
        return board.getElements().some((e) => ids.has(e.id) && e.type !== "text");
      };

      const applyTextPanelStyle = (style) => {
        if (hasTextSelection()) board.setTextStyle(style);
        else if (hasLabelSelection()) board.setLabelStyle(style);
        else board.setTextStyle(style);
      };

      const markSwatches = (container, colors, current) => {
        [...container.querySelectorAll(".swatch")].forEach((sw, i) => {
          if (i < colors.length) sw.classList.toggle("active", norm(colors[i]) === norm(current));
          else sw.classList.remove("active");
        });
      };

      const buildSwatches = (container, colors, current, apply) => {
        container.innerHTML = "";
        for (const c of colors) {
          const sw = document.createElement("button");
          sw.className = "swatch" + (c === "transparent" ? " none" : "");
          if (c !== "transparent") sw.style.background = c;
          sw.title = c === "transparent" ? "Sem preenchimento" : c;
          sw.onclick = () => { apply(c); markSwatches(container, colors, c); };
          container.appendChild(sw);
        }
        const custom = document.createElement("label");
        custom.className = "swatch custom";
        custom.title = "Cor personalizada";
        const inp = document.createElement("input");
        inp.type = "color";
        inp.value = current && current !== "transparent" ? current : "#000000";
        inp.oninput = () => { apply(inp.value); markSwatches(container, colors, inp.value); };
        custom.appendChild(inp);
        container.appendChild(custom);
        markSwatches(container, colors, current);
      };

      function populateSidebar() {
        const st = currentStyle();
        buildSwatches(strokeSwatches, STROKES, st.strokeColor, (c) =>
          board.setStyle({ strokeColor: c }));
        buildSwatches(bgSwatches, BGS, st.backgroundColor, (c) =>
          board.setStyle({ backgroundColor: c }));
        [...widthSeg.children].forEach((b) =>
          b.classList.toggle("active", Number(b.dataset.w) === (st.strokeWidth ?? 2)));
        opacityInput.value = Math.round((st.opacity ?? 1) * 100);
        populateTextControls();
      }

      function populateTextControls() {
        const showText = hasTextSelection() || hasLabelSelection() || board.getTool() === "text";
        textSection.style.display = showText ? "" : "none";
        if (!showText) return;
        const ts = currentTextStyle();
        fontFamilyInput.value = ts.fontFamily;
        if (fontFamilyInput.value !== ts.fontFamily) {
          const opt = document.createElement("option");
          opt.value = ts.fontFamily;
          opt.textContent = "Fonte atual";
          fontFamilyInput.appendChild(opt);
          fontFamilyInput.value = ts.fontFamily;
        }
        fontSizeInput.value = ts.fontSize;
        fontBold.classList.toggle("active", ts.fontWeight === "bold");
        fontItalic.classList.toggle("active", ts.fontStyle === "italic");
        textAlignSeg.querySelectorAll("button").forEach((b) =>
          b.classList.toggle("active", b.dataset.align === ts.textAlign));
        verticalAlignSeg.querySelectorAll("button").forEach((b) =>
          b.classList.toggle("active", b.dataset.valign === ts.verticalAlign));
      }

      fontFamilyInput.onchange = () => {
        applyTextPanelStyle({ fontFamily: fontFamilyInput.value });
        populateTextControls();
      };
      fontSizeInput.onchange = () => {
        const n = Math.max(8, Math.min(120, Number(fontSizeInput.value) || 20));
        applyTextPanelStyle({ fontSize: n });
        populateTextControls();
      };
      fontBold.onclick = () => {
        const ts = currentTextStyle();
        applyTextPanelStyle({ fontWeight: ts.fontWeight === "bold" ? "normal" : "bold" });
        populateTextControls();
      };
      fontItalic.onclick = () => {
        const ts = currentTextStyle();
        applyTextPanelStyle({ fontStyle: ts.fontStyle === "italic" ? "normal" : "italic" });
        populateTextControls();
      };
      textAlignSeg.querySelectorAll("button").forEach((b) => {
        b.onclick = () => {
          applyTextPanelStyle({ textAlign: b.dataset.align });
          populateTextControls();
        };
      });
      verticalAlignSeg.querySelectorAll("button").forEach((b) => {
        b.onclick = () => {
          applyTextPanelStyle({ verticalAlign: b.dataset.valign });
          populateTextControls();
        };
      });

      widthSeg.querySelectorAll("button").forEach((b) => {
        b.onclick = () => {
          board.setStyle({ strokeWidth: Number(b.dataset.w) });
          [...widthSeg.children].forEach((x) => x.classList.toggle("active", x === b));
        };
      });
      opacityInput.oninput = () => board.setStyle({ opacity: Number(opacityInput.value) / 100 });

      const stickyColorSection = document.getElementById("stickyColorSection");
      const stickySwatches = document.getElementById("stickySwatches");

      function populateStickyColors() {
        const ids = board.getSelectedIds();
        if (!ids.length) { stickyColorSection.style.display = "none"; return; }
        const el = board.getElements().find((e) => e.id === ids[0]);
        if (!el || el.type !== "sticky") { stickyColorSection.style.display = "none"; return; }
        stickyColorSection.style.display = "";
        stickySwatches.innerHTML = "";
        const current = norm(el.color || STICKY_COLORS[0]);
        for (const c of STICKY_COLORS) {
          const sw = document.createElement("button");
          sw.className = "swatch" + (norm(c) === current ? " active" : "");
          sw.style.background = c;
          sw.title = c;
          sw.onclick = () => {
            board.updateElement(ids[0], { color: c });
            populateStickyColors();
          };
          stickySwatches.appendChild(sw);
        }
      }

      function updateSidebar() {
        const drawing = !["selection", "hand"].includes(board.getTool());
        const show = board.getSelectedIds().length > 0 || drawing;
        props.style.display = show ? "flex" : "none";
        if (show) { populateSidebar(); populateStickyColors(); }
        else {
          stickyColorSection.style.display = "none";
          textSection.style.display = "none";
        }
      }
      board.on("selectionChange", updateSidebar);
      board.on("toolChange", updateSidebar);
      updateSidebar();

      // ---------- Undo / redo ----------
      document.getElementById("undo").onclick = () => board.undo();
      document.getElementById("redo").onclick = () => board.redo();

      // ---------- Zoom ----------
      document.getElementById("zoomIn").onclick = () => board.zoomIn();
      document.getElementById("zoomOut").onclick = () => board.zoomOut();

      // ---------- Lock / navigate mode ----------
      const lockBtn = document.getElementById("lock");
      const toolsPill = document.getElementById("toolbar");
      lockBtn.innerHTML = icon("unlock");
      board.on("lockChange", (e) => {
        lockBtn.innerHTML = e.locked ? icon("lock") : icon("unlock");
        lockBtn.classList.toggle("active", e.locked);
        lockBtn.title = e.locked
          ? "Navigation mode on — click to edit"
          : "Navigation mode (interact without editing)";
        // Dim the drawing tools while locked (lock button stays usable).
        toolsPill.classList.toggle("locked", e.locked);
      });
      lockBtn.onclick = () => board.toggleLock();

      // ---------- Fullscreen ----------
      const fsBtn = document.getElementById("fullscreen");
      const refreshFs = () => {
        fsBtn.innerHTML = document.fullscreenElement ? MINIMIZE : icon("maximize");
      };
      refreshFs();
      fsBtn.onclick = () => {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen?.();
      };
      document.addEventListener("fullscreenchange", refreshFs);

      // ---------- Appearance ----------
      document.getElementById("selColor").oninput = (e) => board.setAppearance({ selectionColor: e.target.value });
      document.getElementById("gridSpace").oninput = (e) => board.setAppearance({ gridSpacing: Number(e.target.value) });
      document.getElementById("handleSz").oninput = (e) => board.setAppearance({ handleSize: Number(e.target.value) });
      document.getElementById("gridPattern").onchange = (e) => board.setAppearance({ gridPattern: e.target.value });

      // ---------- Search ----------
      const searchBox = document.getElementById("searchBox");
      searchBox.onkeydown = (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          const n = board.searchAndFocus(searchBox.value);
          flash(n > 0 ? `${n} resultado(s)` : "Nada encontrado");
        }
        e.stopPropagation();
      };

      // ---------- Auto-layout ----------
      hamb.querySelectorAll("button[data-layout]").forEach((b) => {
        b.onclick = () => { board.autoLayout(b.dataset.layout); flash("Organizado: " + b.dataset.layout); };
      });

      // ---------- Hamburger actions ----------
      hamb.querySelectorAll(".item[data-act]").forEach((b) => {
        b.onclick = async () => {
          const act = b.dataset.act;
          if (act === "fit") board.zoomToFit();
          else if (act === "focus") {
            board.toggleFocusMode();
            if (board.isFocusMode() && board.getSelectedIds().length === 0)
              flash("Modo foco ON — selecione um elemento");
            else
              flash(board.isFocusMode() ? "Modo foco ON" : "Modo foco OFF");
          }
          else if (act === "celebrate") { board.celebrate(); }
          else if (act === "clear") board.clear();
          else if (act === "png") {
            try {
              const blob = await board.exportPNG({ scale: 2 });
              const a = document.createElement("a");
              a.href = URL.createObjectURL(blob); a.download = "openboard.png"; a.click();
              URL.revokeObjectURL(a.href);
            } catch (err) { alert(err.message); }
          } else if (act === "export") {
            const blob = new Blob([JSON.stringify(manager.toJSON(), null, 2)], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob); a.download = "openboard-workspace.json"; a.click();
            URL.revokeObjectURL(a.href);
          } else if (act === "import") {
            const input = document.createElement("input");
            input.type = "file"; input.accept = "application/json";
            input.onchange = () => {
              const file = input.files?.[0]; if (!file) return;
              const reader = new FileReader();
              reader.onload = () => { try { manager.loadJSON(reader.result); } catch (err) { alert(err.message); } };
              reader.readAsText(file);
            };
            input.click();
          }
          hamb.open = false;
        };
      });

      // keep only one dropdown open + close on outside click
      hamb.addEventListener("toggle", () => { if (hamb.open) bmenu.open = false; });
      bmenu.addEventListener("toggle", () => { if (bmenu.open) hamb.open = false; });
      document.addEventListener("mousedown", (e) => {
        if (hamb.open && !hamb.contains(e.target)) hamb.open = false;
        if (bmenu.open && !bmenu.contains(e.target)) bmenu.open = false;
        if (shapesDD.open && !shapesDD.contains(e.target)) shapesDD.open = false;
        if (stickyDD.open && !stickyDD.contains(e.target)) stickyDD.open = false;
      });

      window.board = board;
      window.boards = manager;
    </script>
  </body>
</html>
