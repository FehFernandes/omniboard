server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compression.
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Security headers that are safe to always enable.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Content-Security-Policy — mitiga XSS (importante: os tokens ficam no
  # localStorage). It is COMMENTED OUT because connect-src has to point at YOUR
  # API; a wrong CSP breaks the app. Adjust the domain and uncomment:
  #
  # add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.seu-dominio.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  # Hashed asset filenames → long, immutable cache.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Fallback de SPA: rotas desconhecidas (client-side routing) devolvem o index.
  # Sem isto, dar F5 em /dashboard retornaria 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
